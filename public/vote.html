<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centre de vote 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04130c; --bv:#008751; --or:#FCD116; --rouge:#E8112D; --vert:#00a859; --vert2:#007a3d;
  --verre:rgba(255,255,255,.07); --trait:rgba(255,255,255,.16); --texte:#f5f7ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sora',system-ui,sans-serif;color:var(--texte);background:var(--bg);overflow:hidden}

/* ---------- Décor : aurore + grille + particules ---------- */
.decor{position:fixed;inset:0;z-index:0;overflow:hidden}
.aurore{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;animation:derive 18s ease-in-out infinite}
.a1{width:55vmax;height:55vmax;background:radial-gradient(circle,var(--bv),transparent 65%);top:-25vmax;left:-15vmax;opacity:.7}
.a2{width:45vmax;height:45vmax;background:radial-gradient(circle,var(--rouge),transparent 65%);bottom:-22vmax;right:-12vmax;opacity:.4;animation-delay:-6s}
.a3{width:30vmax;height:30vmax;background:radial-gradient(circle,var(--or),transparent 65%);top:30%;left:55%;opacity:.22;animation-delay:-11s}
@keyframes derive{50%{transform:translate(6vmax,-4vmax) scale(1.2) rotate(20deg)}}
.grille-fond{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);
  animation:defile 30s linear infinite}
@keyframes defile{to{background-position:56px 56px}}
.etoile{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:scintille 5s infinite}
@keyframes scintille{50%{opacity:.8;transform:translateY(-20px)}}

/* ---------- Barre de progression ---------- */
.drapeau{position:fixed;top:0;left:0;right:0;height:8px;z-index:6;display:flex}
.drapeau b{flex:1}.drapeau b:nth-child(1){background:var(--bv)}.drapeau b:nth-child(2){background:var(--or)}.drapeau b:nth-child(3){background:var(--rouge)}
.emb{width:clamp(90px,14vw,130px);animation:flotte 4s ease-in-out infinite;filter:drop-shadow(0 14px 24px rgba(0,0,0,.5))}
@keyframes flotte{50%{transform:translateY(-10px) rotate(-2deg)}}
.etapes{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px;align-items:center;
  padding:10px 18px;border-radius:999px;background:var(--verre);border:1px solid var(--trait);backdrop-filter:blur(12px)}
.etapes i{width:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.25);transition:all .5s cubic-bezier(.3,1.4,.5,1)}
.etapes i.on{width:38px;background:linear-gradient(90deg,var(--bv),var(--or),var(--rouge))}
.etapes i.fait{background:var(--vert)}

/* ---------- Pages ---------- */
.page{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:clamp(14px,3vh,38px);padding:80px clamp(16px,4vw,48px) 32px;text-align:center;overflow-y:auto;
  opacity:0;visibility:hidden;transform:translateX(60px) scale(.97);filter:blur(8px);
  transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1),filter .6s,visibility .6s}
.page.active{opacity:1;visibility:visible;transform:none;filter:none}
.page.sortie{transform:translateX(-60px) scale(.97)}
.page>:first-child{margin-top:auto}
.page>:last-child{margin-bottom:auto}

h1{font-weight:800;font-size:clamp(2.1rem,6.5vw,4.6rem);line-height:1.05;letter-spacing:-.03em}
h1 .mot{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-60deg)}
.active h1 .mot{animation:mot .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .2s)}
@keyframes mot{to{opacity:1;transform:none}}
.annee{font-weight:800;font-size:clamp(4rem,16vw,10rem);line-height:.9;letter-spacing:-.04em;
  background:linear-gradient(90deg,#00a859,var(--or),var(--rouge),#00a859);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 100%;animation:teinte 6s linear infinite;filter:drop-shadow(0 10px 40px rgba(252,209,22,.35))}
@keyframes teinte{to{background-position:200% 0}}
h2{font-weight:600;font-size:clamp(1.3rem,3.4vw,2.3rem);letter-spacing:-.01em}
.sous{font-weight:300;opacity:.75;font-size:clamp(.95rem,2vw,1.15rem)}

/* ---------- Boutons ---------- */
.btn{flex-shrink:0;position:relative;overflow:hidden;font:inherit;font-weight:600;font-size:1.1rem;cursor:pointer;border:0;color:#1a1200;
  padding:17px 56px;border-radius:999px;background:linear-gradient(135deg,#ffe97a,var(--or) 55%,#e8b400);
  box-shadow:0 12px 34px rgba(252,209,22,.35);transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .3s,opacity .3s,filter .3s}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:brille 3.2s infinite}
@keyframes brille{60%,100%{left:140%}}
.btn:hover:not(:disabled){transform:translateY(-4px) scale(1.06);box-shadow:0 20px 48px rgba(252,209,22,.55)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
.btn:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.55);border:1.5px dashed rgba(255,255,255,.35);cursor:not-allowed;box-shadow:none}
#btnValider{position:sticky;bottom:20px;z-index:10}
.btn:disabled::after{display:none}
.btn.vert{background:linear-gradient(135deg,#1fc57a,var(--vert) 55%,var(--vert2));color:#fff;box-shadow:0 12px 34px rgba(0,168,89,.45)}
.btn.vert:hover{box-shadow:0 20px 48px rgba(0,168,89,.65)}
.btn.contour{background:var(--verre);color:var(--texte);border:1.5px solid var(--trait);box-shadow:none;backdrop-filter:blur(10px)}
.btn.contour::after{display:none}
.btn.contour:hover{background:rgba(255,255,255,.16);box-shadow:none}
.btn.pret:not(:disabled){animation:lueur 1.6s ease-in-out infinite}
@keyframes lueur{50%{box-shadow:0 0 0 12px rgba(252,209,22,.15),0 20px 48px rgba(252,209,22,.6)}}

/* ---------- Cartes candidats ---------- */
.cartes{--t:clamp(120px,25vh,220px);display:grid;grid-template-columns:repeat(4,var(--t));gap:clamp(14px,2.4vw,30px);perspective:1000px}
.carte{position:relative;display:block;cursor:pointer}
.carte input{position:absolute;opacity:0;pointer-events:none}
.corps{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 14px 22px;border-radius:28px;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(14px);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--s,1));
  transition:transform .25s ease-out,background .4s,box-shadow .4s;box-shadow:0 20px 50px rgba(0,0,0,.35);transform-style:preserve-3d}
.corps::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.05) 50%,rgba(255,255,255,.3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:background .4s}
.photo{position:relative;width:100%;aspect-ratio:1;transform:translateZ(40px)}
.photo img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.photo::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);animation:tourne 18s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.nom{font-weight:600;font-size:1.05rem;transform:translateZ(25px)}
.carte:hover .corps{--ty:-8px}
.carte input:focus-visible+.corps{outline:3px solid #fff;outline-offset:4px}
.carte input:checked+.corps{--ty:-12px;--s:1.05;background:linear-gradient(160deg,#1fc57a,var(--vert) 45%,var(--vert2));
  box-shadow:0 0 0 4px rgba(74,222,128,.35),0 26px 70px rgba(0,168,89,.6)}
.carte input:checked+.corps::before{background:linear-gradient(160deg,#fff,#bbf7d0)}
.carte input:checked+.corps .photo::before{border-color:#fff;border-style:solid;animation:onde 1.6s infinite}
@keyframes onde{from{transform:scale(1);opacity:1}to{transform:scale(1.22);opacity:0}}
.badge{position:absolute;top:-12px;right:-12px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;
  transform:scale(0) rotate(-90deg);transition:transform .45s cubic-bezier(.3,1.7,.5,1);z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.badge svg{width:24px;height:24px}
.badge path{stroke:var(--vert2);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.carte input:checked~.badge{transform:none}
.carte input:checked~.badge path{stroke-dashoffset:0;transition:stroke-dashoffset .5s .25s}

/* entrée en cascade des cartes */
.active .carte{animation:monte .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.1s + .15s)}
@keyframes monte{from{opacity:0;transform:translateY(60px) rotateX(25deg)}}

/* ---------- Page 3 ---------- */
.choisi{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:34px 56px;border-radius:34px;background:var(--verre);backdrop-filter:blur(16px)}
.choisi::before{content:"";position:absolute;inset:-3px;border-radius:37px;z-index:-1;
  background:conic-gradient(from var(--ang,0deg),var(--bv),var(--or),var(--rouge),var(--bv));animation:ang 5s linear infinite;filter:blur(1px)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
.choisi::after{content:"";position:absolute;inset:0;border-radius:34px;z-index:-1;background:#07210f}
.choisi img{width:min(220px,52vw);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 20px 60px rgba(0,0,0,.5)}
.choisi .nom{font-size:1.7rem;font-weight:800;transform:none}
.active .choisi{animation:zoom .8s cubic-bezier(.3,1.5,.5,1) both .15s}
@keyframes zoom{from{opacity:0;transform:scale(.5) rotate(-6deg)}}
.actions{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}

/* ---------- Succès ---------- */
.succes{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:rgba(4,19,12,.92);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.succes.on{opacity:1;visibility:visible}
.rond{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,#4ade80,var(--vert2));display:grid;place-items:center;
  box-shadow:0 0 80px rgba(0,168,89,.6);transform:scale(0)}
.on .rond{animation:grandit .7s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes grandit{to{transform:scale(1)}}
.rond svg{width:64px;height:64px}
.rond path{stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.on .rond path{animation:trace .6s .5s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.conf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;animation:chute linear forwards;z-index:21}
@keyframes chute{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Notification (remplace les boîtes de dialogue) ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,140%);z-index:30;max-width:min(92vw,560px);
  display:flex;align-items:center;gap:12px;padding:16px 22px;border-radius:16px;font-weight:600;
  background:rgba(7,33,15,.92);border:1px solid var(--trait);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.5);
  transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.toast.on{transform:translate(-50%,0)}
.toast.erreur{border-color:rgba(232,17,45,.6)}
.toast .pastille{width:12px;height:12px;border-radius:50%;background:var(--or);flex-shrink:0}
.toast.erreur .pastille{background:var(--rouge)}

@media (max-width:820px){.cartes{--t:min(clamp(120px,22vh,200px),40vw);grid-template-columns:repeat(2,var(--t))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}h1 .mot,.active .carte{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="decor" id="decor">
  <div class="aurore a1"></div><div class="aurore a2"></div><div class="aurore a3"></div>
  <div class="grille-fond"></div>
</div>

<div class="drapeau" aria-hidden="true"><b></b><b></b><b></b></div>
<div class="etapes" id="etapes" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

<!-- PAGE 1 : ACCUEIL -->
<section class="page active" id="p1">
  <svg class="emb" viewBox="0 0 120 80" aria-hidden="true">
    <rect width="120" height="80" rx="8" fill="#008751"/>
    <path d="M48 0h64a8 8 0 0 1 8 8v32H48z" fill="#FCD116"/>
    <path d="M48 40h72v32a8 8 0 0 1-8 8H48z" fill="#E8112D"/>
    <path d="M0 8a8 8 0 0 1 8-8h40v80H8a8 8 0 0 1-8-8z" fill="#008751"/>
  </svg>
  <h1><span class="mot" style="--i:0">Bienvenue</span> <span class="mot" style="--i:1">au</span> <span class="mot" style="--i:2">centre</span> <span class="mot" style="--i:3">de</span> <span class="mot" style="--i:4">vote</span></h1>
  <div class="annee">2026</div>
  <p class="sous">Un électeur, une voix.</p>
  <button class="btn" id="btnVoter">Voter</button>
</section>

<!-- PAGE 2 : CHOIX -->
<section class="page" id="p2">
  <h2>Veuillez choisir le candidat que vous désirez</h2>
  <div class="cartes" id="cartes" role="radiogroup" aria-label="Candidats"></div>
  <button class="btn" id="btnValider" disabled>Valider</button>
</section>

<!-- PAGE 3 : CONFIRMATION -->
<section class="page" id="p3">
  <h2>Vous avez choisi :</h2>
  <div class="choisi">
    <img id="photoChoisie" alt="">
    <div class="nom" id="nomChoisi"></div>
  </div>
  <div class="actions">
    <button class="btn vert" id="btnConfirmer">Confirmer</button>
    <button class="btn contour" id="btnAnnuler">Annuler</button>
  </div>
</section>

<!-- Animation de succès -->
<div class="succes" id="succes">
  <div class="rond"><svg viewBox="0 0 64 64"><path d="M14 34l12 12 24-26"/></svg></div>
  <h2>Vote enregistré</h2>
  <p class="sous">Merci d'avoir voté.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="pastille"></span><span id="toastTexte"></span></div>

<script>
const API = "/api/v1";

/* ---------- Avatars générés (aucune vraie personne) ---------- */
function avatar(id, f1, f2, peau, cheveux, haut){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${f1}"/><stop offset="1" stop-color="${f2}"/></linearGradient></defs>
    <rect width="200" height="200" fill="url(#g${id})"/>
    <circle cx="160" cy="40" r="26" fill="#fff" opacity=".18"/>
    <path d="M26 200c0-50 32-70 74-70s74 20 74 70z" fill="${haut}"/>
    <rect x="86" y="108" width="28" height="30" rx="10" fill="${peau}"/>
    <circle cx="100" cy="84" r="38" fill="${peau}"/>
    <path d="M60 80c0-30 18-44 42-44s38 16 38 42c-14-8-26-22-30-30-10 16-30 28-50 32z" fill="${cheveux}"/>
    <circle cx="86" cy="89" r="4.5" fill="#1b1b1b"/><circle cx="114" cy="89" r="4.5" fill="#1b1b1b"/>
    <path d="M88 105q12 9 24 0" stroke="#1b1b1b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const avatarBlanc = 'data:image/svg+xml;utf8,' + encodeURIComponent(
 `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#c7d0d8"/></linearGradient></defs>
  <rect width="200" height="200" fill="url(#b)"/><rect x="58" y="46" width="84" height="108" rx="8" fill="#fff" stroke="#9aa6b1" stroke-width="3"/>
  <path d="M78 92l14 14 30-34" stroke="#008751" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`);

const PALETTE = [
  ['#ffd6a5','#ff9a76','#f1c27d','#3b2a1a','#2563eb'],
  ['#a5d8ff','#6c8cff','#8d5524','#111','#E8112D'],
  ['#b9fbc0','#2dd4bf','#e0ac69','#7c2d12','#008751'],
  ['#fbc4ff','#b06cff','#c68642','#2a1a2a','#9333ea'],
  ['#ffe3a5','#ffb347','#8d5524','#1a1a1a','#d97706'],
];

function construireCandidats(liste){
  let n = 0;
  return liste.map((c) => {
    if (c.id === 0) return { id: 0, nom: c.label, photo: avatarBlanc };
    const p = PALETTE[n % PALETTE.length];
    n += 1;
    return { id: c.id, nom: c.label, photo: avatar(c.id, p[0], p[1], p[2], p[3], p[4]) };
  });
}

/* ---------- État ---------- */
let candidats = [];
let choix = null;
let token = null;
let courante = 0;
let envoiEnCours = false;

/* ---------- Construction des cartes ---------- */
const cartes = document.getElementById('cartes');

function afficherCartes(){
  cartes.innerHTML = '';
  candidats.forEach((c, i) => {
    cartes.insertAdjacentHTML('beforeend', `
    <label class="carte" style="--i:${i}">
      <input type="radio" name="candidat" value="${c.id}">
      <div class="corps">
        <div class="photo"><img src="${c.photo}" alt="${c.nom}"></div>
        <span class="nom">${c.nom}</span>
      </div>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></svg></span>
    </label>`);
  });
  cartes.querySelectorAll('.carte').forEach((carte) => {
    const corps = carte.querySelector('.corps');
    carte.addEventListener('pointermove', (e) => {
      const r = carte.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      corps.style.setProperty('--ry', (x * 16) + 'deg');
      corps.style.setProperty('--rx', (-y * 16) + 'deg');
    });
    carte.addEventListener('pointerleave', () => { corps.style.setProperty('--rx', '0deg'); corps.style.setProperty('--ry', '0deg'); });
  });
}

/* ---------- Étoiles décoratives ---------- */
const decor = document.getElementById('decor');
for (let i = 0; i < 28; i++){
  const s = document.createElement('div'); s.className = 'etoile';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;animation-duration:${4+Math.random()*4}s`;
  decor.appendChild(s);
}

/* ---------- Notification ---------- */
const toast = document.getElementById('toast');
const toastTexte = document.getElementById('toastTexte');
let toastTimer = null;
function notifier(message, type){
  toastTexte.textContent = message;
  toast.classList.toggle('erreur', type === 'erreur');
  toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('on'), 5000);
}

/* ---------- Navigation ---------- */
const pages = [document.getElementById('p1'), document.getElementById('p2'), document.getElementById('p3')];
const points = document.querySelectorAll('#etapes i');
const btnValider = document.getElementById('btnValider');
const btnVoter = document.getElementById('btnVoter');

function aller(n){
  pages[courante].classList.remove('active');
  pages[courante].classList.add('sortie');
  const ancienne = pages[courante];
  setTimeout(() => ancienne.classList.remove('sortie'), 650);
  courante = n;
  pages[n].classList.add('active');
  points.forEach((p, i) => { p.className = i === n ? 'on' : (i < n ? 'fait' : ''); });
}

function reinitialiser(){
  document.querySelectorAll('input[name=candidat]').forEach((i) => { i.checked = false; });
  btnValider.disabled = true; btnValider.classList.remove('pret'); choix = null;
}

/* ---------- Appels serveur ---------- */
async function chargerCandidats(){
  try {
    const r = await fetch(`${API}/candidates`);
    const data = await r.json();
    candidats = construireCandidats(data.candidates || []);
    afficherCartes();
  } catch {
    notifier("Serveur injoignable. Prévenez le responsable du bureau.", 'erreur');
  }
}

btnVoter.onclick = async () => {
  btnVoter.disabled = true;
  try {
    const r = await fetch(`${API}/auth`, { method: 'POST' });
    const data = await r.json();
    if (r.ok && data.status === 'AUTORISE'){
      token = data.token;
      reinitialiser();
      aller(1);
    } else if (data.reason === 'POLL_CLOSED'){
      notifier("Le scrutin est clos. Adressez-vous au responsable.", 'erreur');
    } else {
      notifier("Autorisation refusée. Adressez-vous au responsable.", 'erreur');
    }
  } catch {
    notifier("Service momentanément indisponible. Réessayez dans un instant.", 'erreur');
  } finally {
    btnVoter.disabled = false;
  }
};

cartes.addEventListener('change', (e) => {
  choix = candidats.find((c) => String(c.id) === e.target.value);
  btnValider.disabled = !choix;
  btnValider.classList.toggle('pret', !!choix);
});

btnValider.onclick = () => {
  if (!choix) return;
  const img = document.getElementById('photoChoisie');
  img.src = choix.photo; img.alt = choix.nom;
  document.getElementById('nomChoisi').textContent = choix.nom;
  aller(2);
};

document.getElementById('btnAnnuler').onclick = () => {
  if (token) fetch(`${API}/session/cancel`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  }).catch(() => {});
  token = null;
  reinitialiser();
  aller(0);
};

document.getElementById('btnConfirmer').onclick = async () => {
  if (!choix || !token || envoiEnCours) return;
  envoiEnCours = true;
  try {
    const r = await fetch(`${API}/vote`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, candidate_id: choix.id }),
    });
    const data = await r.json();
    if (r.ok && (data.status === 'ENREGISTRE' || data.status === 'DEJA_ENREGISTRE')){
      token = null;
      afficherSucces();
    } else if (data.reason === 'TOKEN_EXPIRED'){
      notifier("Session expirée. Représentez votre carte.", 'erreur');
      token = null; aller(0);
    } else if (data.reason === 'POLL_CLOSED'){
      notifier("Le scrutin est clos.", 'erreur');
      token = null; aller(0);
    } else {
      notifier("Vote non confirmé. Adressez-vous au responsable.", 'erreur');
    }
  } catch {
    notifier("Service momentanément indisponible. Réessayez dans un instant.", 'erreur');
  } finally {
    envoiEnCours = false;
  }
};

function afficherSucces(){
  const s = document.getElementById('succes');
  s.classList.add('on');
  const couleurs = ['#FCD116', '#008751', '#E8112D', '#00b25f', '#ffe56b'];
  for (let i = 0; i < 60; i++){
    const c = document.createElement('div'); c.className = 'conf';
    c.style.cssText = `left:${Math.random()*100}%;background:${couleurs[i%5]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
  setTimeout(() => { s.classList.remove('on'); reinitialiser(); aller(0); }, 2600);
}

chargerCandidats();
</script>
</body>
</html>
